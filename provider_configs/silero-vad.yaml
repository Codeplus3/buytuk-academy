# =============================================================================
# BuyTuk Academy - Silero Voice Activity Detection (VAD) Configuration
# =============================================================================

model:
  name: "silero_vad"
  device: "cpu"

parameters:
  threshold: 0.5
  min_speech_duration_ms: 250
  max_speech_duration_s: float('inf')
  min_silence_duration_ms: 100
  speech_pad_ms: 30
  
audio:
  sampling_rate: 16000
  window_size_samples: 512