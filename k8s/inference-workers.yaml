apiVersion: apps/v1
kind: Deployment
metadata:
  name: buytuk-whisper
  namespace: buytuk-academy
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: buytuk-whisper }
  template:
    metadata:
      labels: { app.kubernetes.io/name: buytuk-whisper }
    spec:
      containers:
        - name: whisper
          image: buytuk-academy/inference:1.0.1
          command: ["python3", "workers/whisper_worker.py"]
          ports: [{ containerPort: 50051, name: whisper }]
          env:
            - name: WHISPER_PORT
              value: "50051"
            - name: WHISPER_MODEL
              valueFrom: { configMapKeyRef: { name: buytuk-config, key: WHISPER_MODEL } }
          resources:
            requests: { cpu: "1000m", memory: "2Gi" }
            limits: { cpu: "4000m", memory: "8Gi", nvidia.com/gpu: "1" }
          volumeMounts: [{ name: model-cache, mountPath: /root/.cache }]
      volumes: [{ name: model-cache, persistentVolumeClaim: { claimName: buytuk-model-cache } }]
---
apiVersion: v1
kind: Service
metadata:
  name: buytuk-whisper
  namespace: buytuk-academy
spec:
  selector: { app.kubernetes.io/name: buytuk-whisper }
  ports: [{ name: whisper, port: 50051, targetPort: 50051 }]
---
