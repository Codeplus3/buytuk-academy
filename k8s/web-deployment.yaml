# =============================================================================
# BuyTuk Academy - Web Frontend Deployment
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: buytuk-web
  namespace: buytuk-academy
  labels:
    app.kubernetes.io/name: buytuk-web
    app.kubernetes.io/component: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: buytuk-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buytuk-web
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: web
          image: buytuk-academy/web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: buytuk-config
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: buytuk-web
  namespace: buytuk-academy
  labels:
    app.kubernetes.io/name: buytuk-web
spec:
  selector:
    app.kubernetes.io/name: buytuk-web
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  type: ClusterIP