# =============================================================================
# BuyTuk Academy - Secrets
# =============================================================================
# IMPORTANT: In production, use external secret management (AWS Secrets Manager, Vault, etc.)
# This file is for reference only. Values should be base64 encoded.

apiVersion: v1
kind: Secret
metadata:
  name: buytuk-secrets
  namespace: buytuk-academy
  labels:
    app.kubernetes.io/name: buytuk-academy
type: Opaque
stringData:
  # Database
  DATABASE_URL: "postgresql://buytuk:CHANGE_ME_PASSWORD@buytuk-postgres:5432/buytuk_academy"
  DB_PASSWORD: "CHANGE_ME_PASSWORD"
  
  # JWT
  JWT_SECRET: "CHANGE_ME_TO_RANDOM_64_CHAR_STRING"
  
  # Audio Encryption
  AUDIO_KEK: "CHANGE_ME_TO_64_HEX_CHARACTERS"
  
  # AWS
  AWS_ACCESS_KEY_ID: "CHANGE_ME"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
  
  # Inference Gateway
  INFERENCE_API_KEY: "CHANGE_ME"
  
  # LLM Providers
  GEMINI_API_KEY: "CHANGE_ME"
  OPENAI_API_KEY: "CHANGE_ME"
  
  # Email (SMTP)
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"
  SMTP_USER: "CHANGE_ME"
  SMTP_PASSWORD: "CHANGE_ME"
  EMAIL_FROM: "noreply@buytuk.com"
  
  # Notifications
  FCM_SERVER_KEY: "CHANGE_ME"