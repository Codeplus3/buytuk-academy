# =============================================================================
# BuyTuk Academy - PostgreSQL StatefulSet
# =============================================================================

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: buytuk-postgres
  namespace: buytuk-academy
  labels:
    app.kubernetes.io/name: buytuk-postgres
    app.kubernetes.io/component: database
spec:
  serviceName: buytuk-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buytuk-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buytuk-postgres
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_USER
              value: "buytuk"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: buytuk-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              value: "buytuk_academy"
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - buytuk
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - buytuk
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
        storageClassName: gp3
---
apiVersion: v1
kind: Service
metadata:
  name: buytuk-postgres
  namespace: buytuk-academy
  labels:
    app.kubernetes.io/name: buytuk-postgres
spec:
  selector:
    app.kubernetes.io/name: buytuk-postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  type: ClusterIP
  clusterIP: None