# =============================================================================
# BuyTuk Academy - Worker Deployment
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: buytuk-worker
  namespace: buytuk-academy
  labels:
    app.kubernetes.io/name: buytuk-worker
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: buytuk-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buytuk-worker
        app.kubernetes.io/component: worker
    spec:
      containers:
        - name: worker
          image: buytuk-academy/worker:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: buytuk-config
            - secretRef:
                name: buytuk-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            exec:
              command:
                - node
                - -e
                - "process.exit(0)"
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - node
                - -e
                - "process.exit(0)"
            initialDelaySeconds: 10
            periodSeconds: 5
      terminationGracePeriodSeconds: 60