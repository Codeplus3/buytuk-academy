# =============================================================================
# BuyTuk Academy - Horizontal Pod Autoscaler
# =============================================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: buytuk-api-hpa
  namespace: buytuk-academy
  labels:
    app.kubernetes.io/name: buytuk-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: buytuk-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: buytuk-web-hpa
  namespace: buytuk-academy
  labels:
    app.kubernetes.io/name: buytuk-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: buytuk-web
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 70