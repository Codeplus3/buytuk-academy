# =============================================================================
# BuyTuk Academy - Redis Deployment
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: buytuk-redis
  namespace: buytuk-academy
  labels:
    app.kubernetes.io/name: buytuk-redis
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buytuk-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buytuk-redis
        app.kubernetes.io/component: cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory
            - 512mb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: buytuk-redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buytuk-redis-data
  namespace: buytuk-academy
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
  storageClassName: gp3
---
apiVersion: v1
kind: Service
metadata:
  name: buytuk-redis
  namespace: buytuk-academy
  labels:
    app.kubernetes.io/name: buytuk-redis
spec:
  selector:
    app.kubernetes.io/name: buytuk-redis
  ports:
    - port: 6379
      targetPort: 6379
      name: redis
  type: ClusterIP