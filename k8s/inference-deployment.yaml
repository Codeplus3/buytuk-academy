# =============================================================================
# BuyTuk Academy - Inference Gateway Deployment
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: buytuk-inference
  namespace: buytuk-academy
  labels:
    app.kubernetes.io/name: buytuk-inference
    app.kubernetes.io/component: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buytuk-inference
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buytuk-inference
        app.kubernetes.io/component: inference
    spec:
      containers:
        - name: inference
          image: buytuk-academy/inference:1.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 50050
              name: gateway
              protocol: TCP
            - containerPort: 50051
              name: whisper
              protocol: TCP
            - containerPort: 50052
              name: alignment
              protocol: TCP
            - containerPort: 50053
              name: g2p
              protocol: TCP
            - containerPort: 50054
              name: feedback
              protocol: TCP
          envFrom:
            - configMapRef:
                name: buytuk-config
            - secretRef:
                name: buytuk-secrets
          env:
            - name: INFERENCE_ALLOW_INSECURE
              value: "false"
            - name: INFERENCE_TLS_CERT
              value: "/var/run/secrets/buytuk-inference/tls.crt"
            - name: INFERENCE_TLS_KEY
              value: "/var/run/secrets/buytuk-inference/tls.key"
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          livenessProbe:
            tcpSocket:
              port: 50050
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 50050
            initialDelaySeconds: 20
            periodSeconds: 5
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache
            - name: inference-tls
              mountPath: /var/run/secrets/buytuk-inference
              readOnly: true
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: buytuk-model-cache
        - name: inference-tls
          secret:
            secretName: buytuk-inference-tls
---
apiVersion: v1
kind: Service
metadata:
  name: buytuk-inference
  namespace: buytuk-academy
  labels:
    app.kubernetes.io/name: buytuk-inference
spec:
  selector:
    app.kubernetes.io/name: buytuk-inference
  ports:
    - port: 50050
      targetPort: 50050
      name: gateway
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buytuk-model-cache
  namespace: buytuk-academy
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: gp3