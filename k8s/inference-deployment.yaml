# =============================================================================
# BuyTuk Academy - Inference Gateway Deployment
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: buytuk-inference
  namespace: buytuk-academy
  labels:
    app.kubernetes.io/name: buytuk-inference
    app.kubernetes.io/component: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: buytuk-inference
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buytuk-inference
        app.kubernetes.io/component: inference
    spec:
      containers:
        - name: inference
          image: buytuk-academy/inference:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 50050
              name: gateway
              protocol: TCP
            - containerPort: 50051
              name: whisper
              protocol: TCP
            - containerPort: 50052
              name: alignment
              protocol: TCP
            - containerPort: 50053
              name: g2p
              protocol: TCP
            - containerPort: 50054
              name: feedback
              protocol: TCP
          envFrom:
            - configMapRef:
                name: buytuk-config
            - secretRef:
                name: buytuk-secrets
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
            limits:
              cpu: "4000m"
              memory: "8Gi"
          livenessProbe:
            tcpSocket:
              port: 50050
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 50050
            initialDelaySeconds: 20
            periodSeconds: 5
          volumeMounts:
            - name: model-cache
              mountPath: /root/.cache
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: buytuk-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: buytuk-inference
  namespace: buytuk-academy
  labels:
    app.kubernetes.io/name: buytuk-inference
spec:
  selector:
    app.kubernetes.io/name: buytuk-inference
  ports:
    - port: 50050
      targetPort: 50050
      name: gateway
    - port: 50051
      targetPort: 50051
      name: whisper
    - port: 50052
      targetPort: 50052
      name: alignment
    - port: 50053
      targetPort: 50053
      name: g2p
    - port: 50054
      targetPort: 50054
      name: feedback
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: buytuk-model-cache
  namespace: buytuk-academy
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  storageClassName: gp3